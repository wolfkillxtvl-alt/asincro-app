<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASINCRO - Buzón de Mensajes</title>
<style>
  :root {
    --primary: #1e293b;
    --primary-dark: #0f172a;
    --accent: #f59e0b;
    --bg: #f8fafc;
    --text: #1f2937;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

  .navbar {
    background: var(--primary); color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 20px 35px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  }
  .brand-logo { font-size: 24px; font-weight: 900; letter-spacing: 1px; color: var(--accent); text-decoration: none; }
  .nav-links-right { display: flex; gap: 20px; align-items: center; }
  .nav-link-custom { color: #fff; text-decoration: none; font-size: 14px; font-weight: 600; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 8px; transition: all 0.2s; }
  .nav-link-custom:hover { background: rgba(255,255,255,0.22); }

  .main-container { max-width: 900px; width: 100%; margin: 40px auto; padding: 0 20px; flex: 1; }
  .page-heading { font-size: 28px; font-weight: 800; color: #111827; margin-bottom: 18px; }

  .outer-board { background: #ffffff; border: 2px solid #cbd5e1; border-radius: 18px; padding: 28px; box-shadow: 0 6px 20px rgba(0,0,0,0.03); }
  .board-header { font-size: 15px; font-weight: 700; color: #111827; padding-bottom: 14px; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; }

  .message-item {
    background: #f8fafc; border: 1.5px solid #e2e8f0; border-left: 4px solid var(--primary); border-radius: 10px;
    padding: 16px 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;
  }
  .message-text { font-size: 15px; font-weight: 700; color: var(--text); }
  .message-date { font-size: 12px; color: var(--muted); font-weight: 600; }
  .empty-box { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

  <nav class="navbar">
    <a href="/dashboard" class="brand-logo">⚡ ASINCRO</a>
    <div class="nav-links-right">
      <a href="javascript:history.back()" class="nav-link-custom">← Regresar</a>
      <a href="/dashboard" class="nav-link-custom">Volver al Panel Principal</a>
    </div>
  </nav>

  <div class="main-container">
    <h1 class="page-heading">Buzón de Mensajes</h1>

    <div class="outer-board">
      <div class="board-header">Notificaciones y avisos del sistema</div>

      {% if messages %}
        {% for msg in messages %}
        <div class="message-item">
          <div class="message-text">📬 {{ msg.texto }}</div>
          <div class="message-date">{{ msg.fecha }}</div>
        </div>
        {% endfor %}
      {% else %}
        <div class="empty-box">
          <div style="font-size: 32px; margin-bottom: 8px;">📭</div>
          Usted no tiene ningún mensaje.
        </div>
      {% endif %}
    </div>
  </div>

</body>
</html>
